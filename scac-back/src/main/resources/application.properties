spring.application.name=scac-back
server.port=8888

# JPA 설정
# update : 변경된 컬럼 추가(기존 데이터 유지)
# create : 매번 재생성(기존 데이터 삭제)
# none: 아무것도 하지 않음 (운영 환경 권장)
spring.jpa.hibernate.ddl-auto=none

# 실행 SQL 콘솔 출력(작업용, 운영할때는 false)
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=${JWT_SECRET}
jwt.access-expiration=1800000
jwt.refresh-expiration=604800000

# MyBatis Setting
# MyBatis Mapper Locations
mybatis.mapper-locations=classpath:mappers/**/*.xml
# MyBatis Aliase 
# mybatis.type-aliases-package=com.scac.dto
# MyBatis Configuration underbars to camelCase
mybatis.configuration.map-underscore-to-camel-case=true

# import .env
spring.config.import=optional:file:.env[.properties]

# FrontEnd URL (Redirect URL)
app.frontend-url=http://localhost:3000,http://localhost:3001

# TossPay 토스 시크릿 키
toss.secret-key=${TOSS_SECRET_KEY}

# SMS 설정 (provider: mock / coolsms / sens)
app.sms.provider=${SMS_PROVIDER:mock}
app.sms.api-key=${SMS_API_KEY:}
app.sms.api-secret=${SMS_API_SECRET:}
app.sms.from-number=${SMS_FROM_NUMBER:01000000000}
app.sms.sens-service-id=${SMS_SENS_SERVICE_ID:}

# 사용자 이용권 만료 알림 기본값 (false:알림 안보냄, 문자 발송 담당자만 .env에서 NOTIFICATION_ENABLED=true 써두세요)
notification.enabled=${NOTIFICATION_ENABLED:false}
# 사용자 이용권 만료 안내 시간
notification.expiration.time-minutes=30
notification.expiration.period-hours=24

# SOLAPI
solapi.api-key=${SOLAPI_API_KEY:}
solapi.api-secret=${SOLAPI_API_SECRET:}
solapi.sender-number=${SOLAPI_SENDER_NUMBER:}
